$kind: http-request
method: POST
url: '{{baseUrl}}/bookings'
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "customerName": "Tenzin",
      "showId": {{showId}},
      "seatIds": [{{otherShowSeatId}}]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', () => pm.response.to.have.status(404));
      pm.test('Detail says the seat is not in this show', () => {
        pm.expect(pm.response.json().detail).to.include('not found for show ' + pm.collectionVariables.get('showId'));
      });
