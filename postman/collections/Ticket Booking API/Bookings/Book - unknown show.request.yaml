$kind: http-request
method: POST
url: '{{baseUrl}}/bookings'
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "customerName": "Tenzin",
      "showId": 999999,
      "seatIds": [{{seatA3}}]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', () => pm.response.to.have.status(404));
      pm.test('Detail names the show', () => pm.expect(pm.response.json().detail).to.eql('Show 999999 not found'));
