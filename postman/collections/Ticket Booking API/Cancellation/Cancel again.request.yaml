$kind: http-request
method: DELETE
url: '{{baseUrl}}/bookings/{{bookingId}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409 Conflict', () => pm.response.to.have.status(409));
      pm.test('Detail says already cancelled', () => pm.expect(pm.response.json().detail).to.include('already cancelled'));
