$kind: http-request
method: POST
url: '{{baseUrl}}/bookings'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "customerName": "Someone Else",
      "showId": {{showId}},
      "seatIds": [{{seatA2}}]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201 Created', () => pm.response.to.have.status(201));
      pm.test('A2 now belongs to the new customer', () => {
        const b = pm.response.json();
        pm.expect(b.customerName).to.eql('Someone Else');
        pm.expect(b.seats.map(s => s.seatNumber)).to.eql(['A2']);
      });
