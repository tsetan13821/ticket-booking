$kind: http-request
method: GET
url: '{{baseUrl}}/shows'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const shows = pm.response.json();
      pm.test('Contains the created show', () => {
        const id = Number(pm.collectionVariables.get('showId'));
        pm.expect(shows.map(s => s.id)).to.include(id);
      });
      pm.test('Sorted by start time ascending', () => {
        const times = shows.map(s => s.startTime);
        pm.expect(times).to.eql([...times].sort());
      });
